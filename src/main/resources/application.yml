/spring:
  application:
    name: ark-fund-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arkdb}
    username: ${SPRING_DATASOURCE_USERNAME:ark}
    password: ${SPRING_DATASOURCE_PASSWORD:ark_local_pw}

  jpa:
    # Flyway owns the schema. Hibernate must never alter it — `validate` fails
    # fast at startup if the entities and the migrated schema have drifted,
    # which is far safer than `update` silently changing production tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8083
  error:
    include-message: always
  # The app sits behind API Gateway and an internal ALB, so honour their
  # X-Forwarded-* headers rather than the immediate connection: without this,
  # any absolute URL Spring generates (redirects, Location headers) points at
  # the internal hop instead of the public one.
  #
  # Note this does NOT fix the OpenAPI server URL on its own — the ALB sets
  # X-Forwarded-Proto from its own listener, which is plain HTTP:80 in the
  # demo environment, so a derived URL would still come out as http://. That
  # is handled explicitly with a relative server URL in OpenApiConfig.
  #
  # Safe here specifically because the tasks are reachable only through that
  # ALB behind API Gateway — nothing else can reach them to spoof the headers.
  forward-headers-strategy: FRAMEWORK

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

# Guards the reporting endpoints (ReportingService), the most DB-intensive
# read path in this API — RDS is this app's only real external dependency,
# so that's where a struggling downstream could otherwise cascade into
# every request piling up on an exhausted connection pool instead of
# failing fast. See ReportingService for where this is actually applied.
resilience4j:
  circuitbreaker:
    instances:
      database:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Without this, a 404 for a bad client/fund/investor ID counts as a
        # circuit-breaker "failure" like any other exception — a wave of
        # ordinary client typos would trip the breaker exactly as if RDS
        # were actually down. Only genuine infrastructure failures should
        # count; these two are normal, expected outcomes already mapped to
        # their own HTTP statuses by ApiExceptionHandler.
        ignore-exceptions:
          - com.ark.fundapi.exception.ResourceNotFoundException
          - com.ark.fundapi.exception.BusinessRuleException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.ark.fundapi: INFO
