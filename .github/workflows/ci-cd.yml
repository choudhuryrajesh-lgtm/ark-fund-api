name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ECR_REPOSITORY: ark-fund-api
  AWS_REGION: us-east-1

permissions:
  id-token: write   # OIDC federation to AWS — no long-lived AWS keys in the repo
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvn verify runs against in-memory H2, no external services needed here.
      - name: Run tests
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Dependency vulnerability scan
        run: mvn -B org.owasp:dependency-check-maven:check
        continue-on-error: true   # advisory in this pipeline; see 09-Security.md for gating plan

      - name: Static analysis (SpotBugs)
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check
        continue-on-error: true

  build-image:
    name: Build & push image
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY — remove once the OIDC assume-role failure is resolved.
      # Prints the actual token claims GitHub issues for this run, so they
      # can be compared byte-for-byte against the IAM role's trust policy
      # instead of guessing. JWT payloads aren't encrypted, only signed, so
      # printing aud/sub/repository/ref isn't a secret disclosure.
      - name: Debug OIDC token claims
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -o /tmp/oidc_token_response.json
          python3 - <<'PYEOF'
          import json, base64

          with open("/tmp/oidc_token_response.json") as f:
              resp = json.load(f)
          token = resp["value"]
          payload_b64 = token.split(".")[1]
          payload_b64 += "=" * (-len(payload_b64) % 4)
          payload = json.loads(base64.urlsafe_b64decode(payload_b64))
          keys = ("aud", "sub", "iss", "repository", "ref", "repository_owner")
          print(json.dumps({k: payload[k] for k in keys if k in payload}, indent=2))
          PYEOF

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg INCLUDE_NEW_RELIC=true -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-demo:
    name: Deploy to demo
    needs: build-image
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.demo.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # demo is a single-task, throwaway environment (terraform/README.md) —
      # no CodeDeploy blue/green here, just a plain rolling update, same as
      # the ecs_service resource modules/ecs creates for it.
      - name: Deploy to ECS (demo)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-demo
          cluster: ark-fund-demo
          wait-for-service-stability: true

  deploy-staging:
    name: Deploy to staging
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.staging.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # ECS rolling update: minHealthyPercent 100 / maxPercent 200 keeps full
      # capacity throughout the deploy (new tasks join before old ones drain).
      - name: Deploy to ECS (staging)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-api-staging
          cluster: ark-fund-staging
          wait-for-service-stability: true

      - name: Run smoke test
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://api-staging.ark.internal/actuator/health

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # requires manual approval — see 05-CICD.md §4
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.production.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # CodeDeploy blue/green: shifts traffic via the ALB listener, keeps the
      # old task set warm for the bake time so a rollback is a listener flip,
      # not a redeploy. See 05-CICD.md §3 and 13-Disaster-Recovery-Failover.md.
      - name: Deploy to ECS (production, blue/green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-api-production
          cluster: ark-fund-production
          codedeploy-appspec: deploy/ecs/appspec.yaml
          codedeploy-application: ark-fund-api
          codedeploy-deployment-group: ark-fund-api-production
          wait-for-service-stability: true

      - name: Run smoke test
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://api.ark.com/actuator/health