name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ECR_REPOSITORY: ark-fund-api
  AWS_REGION: us-east-1

permissions:
  id-token: write   # OIDC federation to AWS — no long-lived AWS keys in the repo
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — SonarCloud's new-code
          # detection and blame info (whose commit introduced an issue) need it.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvn verify runs against in-memory H2, no external services needed here.
      # jacoco-maven-plugin (pom.xml) instruments this run, producing the
      # coverage report the SonarCloud scan step below reads.
      - name: Run tests
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Dependency vulnerability scan
        run: mvn -B org.owasp:dependency-check-maven:check
        continue-on-error: true   # advisory in this pipeline; see 09-Security.md for gating plan

      - name: Static analysis (SpotBugs)
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check
        continue-on-error: true

      # Code quality + coverage, feeding off the jacoco.xml the "Run tests"
      # step above already produced. No version pinned on the plugin
      # coordinate — SonarSource's own documented invocation, resolves
      # latest from Maven Central at run time. SONAR_PROJECT_KEY/
      # SONAR_ORGANIZATION are repo variables (not secrets — they're
      # identifiers, not credentials), SONAR_TOKEN is the one actual
      # secret. See README.md's testing section for one-time setup.
      - name: SonarCloud scan (code quality + coverage)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        continue-on-error: true   # advisory, matching the OWASP/SpotBugs steps above — not a merge gate yet

  build-image:
    name: Build & push image
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Registers binfmt_misc handlers so the RUN steps in the Dockerfile
      # (mvn, apk add) can actually execute under ARM64 emulation on this
      # x86_64 runner — without this, --platform linux/arm64 below fails or
      # silently builds the wrong architecture.
      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Build, tag, push
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # --platform linux/arm64 required: GitHub's ubuntu-latest runners
          # are x86_64, but the ECS task definitions (modules/ecs, and
          # deploy/ecs/task-definition.*.json) request ARM64/Graviton —
          # without this, the pushed image is the wrong architecture and
          # every task fails immediately at exec (exit code 255).
          docker build --platform linux/arm64 --build-arg INCLUDE_NEW_RELIC=true -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-demo:
    name: Deploy to demo
    needs: build-image
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.demo.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # demo is a single-task, throwaway environment (terraform/README.md) —
      # no CodeDeploy blue/green here, just a plain rolling update, same as
      # the ecs_service resource modules/ecs creates for it.
      - name: Deploy to ECS (demo)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-demo
          cluster: ark-fund-demo
          wait-for-service-stability: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Real post-deploy verification, not just a health-check curl: the
      # same Cucumber feature files as the local component-test tier
      # (src/test/resources/features), but run as a pure black-box HTTP
      # client against the demo service that just went live — see
      # SmokeCucumberConfiguration for why this needs no local Spring Boot
      # bootstrap at all. wait-for-service-stability above already confirmed
      # the ECS task is healthy; this confirms the API actually behaves
      # correctly end to end (client/fund/investor/transaction CRUD,
      # reporting arithmetic) through the real Route 53 -> API Gateway ->
      # ALB -> ECS path, not just that the container started.
      #
      # DEMO_API_URL is a repository variable (Settings -> Secrets and
      # variables -> Actions -> Variables) — set it once via:
      #   gh variable set DEMO_API_URL --body "$(cd terraform/environments/demo && terraform output -raw api_url)"
      # and update it again any time demo's API Gateway gets torn down and
      # recreated (its invoke URL isn't stable across a destroy/apply cycle).
      - name: Post-deploy smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.DEMO_API_URL }}
        run: mvn -B verify -Psmoke-tests

  deploy-staging:
    name: Deploy to staging
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    # Disabled until terraform/environments/staging is actually applied —
    # the task definition still has ACCOUNT_ID/domain placeholders (see
    # deploy/ecs/task-definition.staging.json), so this job would fail every
    # run otherwise. Delete this line once staging is real.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.staging.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # ECS rolling update: minHealthyPercent 100 / maxPercent 200 keeps full
      # capacity throughout the deploy (new tasks join before old ones drain).
      - name: Deploy to ECS (staging)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-api-staging
          cluster: ark-fund-staging
          wait-for-service-stability: true

      - name: Run smoke test
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://api-staging.ark.internal/actuator/health

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # requires manual approval — see 05-CICD.md §4
    # Disabled for the same reason as deploy-staging above (which this also
    # transitively skips via `needs`) — explicit here too for clarity.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976193264048:role/github-actions-ark-fund-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-definition.production.json
          container-name: ark-fund-api
          image: ${{ needs.build-image.outputs.image }}

      # CodeDeploy blue/green: shifts traffic via the ALB listener, keeps the
      # old task set warm for the bake time so a rollback is a listener flip,
      # not a redeploy. See 05-CICD.md §3 and 13-Disaster-Recovery-Failover.md.
      - name: Deploy to ECS (production, blue/green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ark-fund-api-production
          cluster: ark-fund-production
          codedeploy-appspec: deploy/ecs/appspec.yaml
          codedeploy-application: ark-fund-api
          codedeploy-deployment-group: ark-fund-api-production
          wait-for-service-stability: true

      - name: Run smoke test
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://api.ark.com/actuator/health