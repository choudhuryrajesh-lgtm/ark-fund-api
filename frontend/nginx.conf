# Serves the built React app and reverse-proxies /api to the api container
# by its Docker Compose service name, so the browser only ever talks to one
# origin — no CORS configuration needed on the Spring Boot side.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}